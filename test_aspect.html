<!DOCTYPE html>
<html>
<head>
<style>
  body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  .container { position: relative; width: 100%; height: 92vh; background: red; overflow: hidden; }
  .video {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw; height: 56.25vw;
    min-height: 92vh; min-width: 163.55vh; /* 92 * 16/9 = 163.55 */
  }
</style>
</head>
<body>
  <div class="container">
    <iframe class="video" src="https://www.youtube.com/embed/V0Fqdb-smqo?autoplay=1&controls=0&mute=1" frameborder="0"></iframe>
  </div>
</body>
</html>
