<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>JamBox+</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect to external critical media & API origins for faster loading -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://qp-pldt-image-resizer-cloud-prod.akamaized.net" crossorigin />
    <link rel="dns-prefetch" href="https://qp-pldt-image-resizer-cloud-prod.akamaized.net" />
    <link rel="preconnect" href="https://lottie.host" crossorigin />
    <link rel="dns-prefetch" href="https://lottie.host" />
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module" defer></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3009183220779634" crossorigin="anonymous"></script>
  </head>
  <body className="bg-[#0F1113] text-[#F4F5F7]">
    <!-- Invisible SVG refraction filter for liquid glass effects -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
      <filter id="refraction-filter" x="-20%" y="-20%" width="140%" height="140%">
        <!-- Generate a noise pattern to simulate glass curvature/imperfections -->
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <!-- Displace background pixels based on the noise map -->
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
