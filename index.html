    <!-- JSON-LD Structured Data for Google SEO (Rich Results & Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "JamBox+",
      "alternateName": ["JamboxPlus", "JamBox Plus", "Jambox", "CineVault"],
      "description": "Stream, discover, and search all your favorite movies and TV shows in one unified streaming aggregator.",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Web, Android, iOS, Windows, macOS",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <meta name="theme-color" content="#0B0C10" />

  </head>
  <body className="bg-[#0F1113] text-[#F4F5F7]">
    <!-- Invisible SVG refraction filter for liquid glass effects -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
      <filter id="refraction-filter" x="-20%" y="-20%" width="140%" height="140%">
        <!-- Generate a noise pattern to simulate glass curvature/imperfections -->
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <!-- Displace background pixels based on the noise map -->
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
